name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install -r requirements.txt || true

    - name: Run lint
      run: echo "No linter yet — add flake8 or pylint here."

    - name: Confirm CI Success
      run: echo "✅ FlowCascade pipeline succeeded."
